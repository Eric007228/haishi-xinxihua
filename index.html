<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 浏览器标签页上显示的名字 -->
  <title>海事知识笔记</title>
  <meta name="description" content="海事信息化课程笔记：按章节浏览、关键词搜索的在线笔记站">
  <!-- 手机上也能正常缩放阅读 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- docsify 自带主题样式（国内 CDN，比国外的 jsdelivr 稳） -->
  <link rel="stylesheet" href="https://cdn.staticfile.net/docsify/4.13.1/themes/vue.css">
  <style>
    /* ===== 封面美化（2026-09-27 换手绘 SVG 版）：插画铺满整屏 ===== */
    /* SVG 自带配色，只需一层很淡的蓝纱统一色调 + 保证白字读得清（!important 盖过主题自带的绿色渐变） */
    section.cover {
      background: linear-gradient(rgba(13, 43, 74, 0.18), rgba(13, 43, 74, 0.32)),
                  url('assets/cover.svg') center / cover no-repeat !important;
    }
    /* 白字加一点点深色描影，落在亮天空上也能读清 */
    section.cover .cover-main h1,
    section.cover .cover-main blockquote,
    section.cover .cover-main p,
    section.cover .cover-main .app-name-link { text-shadow: 0 1px 6px rgba(13, 43, 74, 0.55); }
    /* 封面上的文字统一改白色（主题默认是绿色，压在插画上会看不清） */
    /* 注意：标题文字套了三层 h1 > a.anchor > span，必须连 span 一起压成白 */
    section.cover .cover-main h1,
    section.cover .cover-main h1 a,
    section.cover .cover-main h1 span,
    section.cover .cover-main blockquote,
    section.cover .cover-main p { color: #fff !important; }
    section.cover .cover-main blockquote { border-left-color: rgba(255, 255, 255, 0.6); }
    /* 站名链接白色 */
    section.cover .cover-main .app-name-link { color: #fff; }
    /* 封面目录里的链接自己画成"胶囊按钮"（不依赖 docsify 自动加的按钮样式） */
    section.cover .cover-main ul li a {
      display: inline-block;
      margin: 0.4em 0.3em;
      padding: 0.55em 1.6em;
      border: 1px solid #fff;
      border-radius: 2rem;
      color: #fff;
      /* Day 9：加一层半透明深色底，白字落在亮天空上也能读清（对比度达标） */
      background: rgba(13, 43, 74, 0.35);
    }
    /* 第一个按钮用深青绿实底，突出"开始阅读"（Day 9：浅绿 #42b983 上白字对比度只有 2.47:1，看不清；换成深绿后 5.32:1 达标） */
    section.cover .cover-main ul li:first-child a {
      background-color: #1e7a4e;
      border-color: #1e7a4e;
    }
    section.cover .cover-main ul li a:hover { opacity: 0.85; }

    /* ===== 首页主视图：笔记卡片网格（Day 8 mock 数据版） ===== */
    /* 网格布局：一行放几张由屏幕宽度自动决定，窄屏自动变单列 */
    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin: 12px 0 28px;
    }
    /* 单张卡片：一列小布局（标签 → 标题 → 摘要），悬停时轻轻浮起 */
    .note-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      border: 1px solid #eaecef;
      border-radius: 8px;
      background: #fff;
      text-decoration: none;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .note-card:hover { box-shadow: 0 4px 14px rgba(13, 43, 74, 0.12); transform: translateY(-2px); }
    /* 卡片上的章节小标签（胶囊形状）—— Day 9：浅绿字压白底只有 2.47:1，换深绿 5.32:1；上下内边距 1px→2px 并加行高，胶囊不再被压扁 */
    .note-card-tag {
      align-self: flex-start;
      font-size: 12px;
      line-height: 1.6;
      color: #1e7a4e;
      border: 1px solid #1e7a4e;
      border-radius: 999px;
      padding: 2px 10px;
    }
    /* 演示用的假卡片：标签变灰色，跟真笔记区分开（Day 9：#999 只有 2.85:1，换 #767676 达 4.54:1） */
    .note-card-demo .note-card-tag { color: #767676; border-color: #767676; }
    .note-card-title { font-weight: 600; color: #2c3e50; font-size: 16px; }
    .note-card-summary { color: #6b7280; font-size: 13px; line-height: 1.6; }
    /* 卡片底部的更新日期（PRD 第 5 节：updated 让读者知道内容新旧）—— Day 9：#a0a6ad 只有 2.46:1 看不清，换 #6b7280 达 4.83:1 */
    .note-card-updated { color: #6b7280; font-size: 12px; margin-top: auto; padding-top: 4px; }
    /* "📚 笔记导航"区域标题（用 div 手动画成标题的样子，不进左侧目录） */
    .note-grid-heading { font-size: 22px; font-weight: 600; color: #2c3e50; margin: 20px 0 4px; }
    /* 加载中 / 空 / 出错 三种状态的提示条 */
    .note-grid-state { padding: 20px; border-radius: 8px; text-align: center; margin: 12px 0 28px; }
    .note-grid-loading { background: #f3f6f9; color: #5a7391; }
    .note-grid-empty { background: #f8f8f8; color: #888; border: 1px dashed #ddd; }
    .note-grid-error { background: #fdf0ef; color: #c0392b; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <!-- docsify 会把这个 div 里的内容替换成渲染好的笔记 -->
  <div id="app">正在加载笔记，请稍候……</div>

  <script>
    // ============================================================
    // 站点配置：整个网站的所有开关都在这一块（技术设计文档"对象 3：站点配置"）
    // 想改站名、搜索提示语，只动这里，不用碰别的文件
    // ============================================================
    window.$docsify = {
      name: '海事知识笔记',        // 站名，显示在左上角侧边栏顶部
      loadSidebar: true,           // 打开侧边栏目录（读取 _sidebar.md）
      coverpage: true,             // 打开封面页（读取 _coverpage.md，整屏显示）
      subMaxLevel: 2,              // 笔记正文里的一、二级标题也显示进侧边栏
      homepage: 'README.md',       // 打开网站根地址时显示哪一篇（首页说明）
      notFoundPage: '_404.md',     // 地址打错时显示的友好提示页
      relativePath: true,          // 侧边栏链接可以省掉 .md 后缀，写起来更短
      // 搜索插件：关键词在访客浏览器里现场建索引，所以搜得到、又不占服务器
      search: {
        placeholder: '搜索关键词（例如：港口）',
        noData: '没有找到相关笔记',
        paths: 'auto',             // 自动把侧边栏里列出的笔记都纳入搜索范围
        maxAge: 3600000            // 搜索索引缓存 1 小时（默认 24 小时：加了新笔记当天会搜不到）
      }
    }
  </script>

  <!-- 本地假数据（Day 8）：首页卡片的"临时数据库"，第 3 周接真实 API 后可撤掉 -->
  <script src="mock-data.js"></script>

  <!-- ============================================================
       首页主视图：笔记卡片列表（Day 8 mock 数据版）
       用的是 docsify 的"插件"机制：它允许我们在"每次页面渲染完成后"
       （doneEach 这个时机）往页面里塞自己的内容。
       ============================================================ -->
  <script>
    (function () {
      // —— 可复用组件（余力加练）：单张笔记卡片 ——
      // 好处：以后别的地方也想显示一张笔记卡（比如搜索结果页），
      // 直接调 window.renderNoteCard(某条数据) 就行，不用复制粘贴 HTML。
      window.renderNoteCard = function (note) {
        return ''
          + '<a class="note-card' + (note.demo ? ' note-card-demo' : '') + '" href="' + note.link + '">'
          +   '<span class="note-card-tag">' + note.chapter + '</span>'
          +   '<span class="note-card-title">' + note.title + '</span>'
          +   '<span class="note-card-summary">' + note.summary + '</span>'
          +   '<span class="note-card-updated">更新于 ' + note.updated + '</span>'
          + '</a>';
      };

      // 三种状态的小提示条：加载中 / 空 / 出错，共用同一个外框样式
      function stateBox(className, text) {
        return '<div class="note-grid-state ' + className + '">' + text + '</div>';
      }

      function noteCardGrid(hook) {
        hook.doneEach(function () {
          // 只在首页显示主视图（地址是 #/、空、或 #/README.md），进笔记页就不显示
          var hash = location.hash;
          if (hash !== '#/' && hash !== '' && hash !== '#/README.md') return;

          var section = document.querySelector('.markdown-section');
          if (!section) return;

          // 先清掉旧容器（docsify 翻页回来会重复触发这里，不清会叠好几层）
          var old = document.getElementById('note-card-grid-wrap');
          if (old) old.remove();

          var wrap = document.createElement('div');
          wrap.id = 'note-card-grid-wrap';

          // 【状态 1：加载中】先摆上"加载中"提示
          // （本地假数据是秒读的，肉眼看不到这行；第 3 周接真实 API 后就有用了）
          wrap.innerHTML = stateBox('note-grid-loading', '⏳ 正在加载笔记卡片……');

          if (typeof window.MOCK_NOTES === 'undefined') {
            // 【状态 3：出错】mock-data.js 没读到（比如文件被误删）→ 明确告诉用户哪里坏了
            wrap.innerHTML = stateBox('note-grid-error', '⚠️ 卡片数据加载失败：找不到 mock-data.js，请检查文件是否存在');
          } else if (window.MOCK_NOTES.length === 0) {
            // 【状态 2：空】数据文件在但一条笔记都没有 → 空状态（四种状态里最容易被忽略的！）
            wrap.innerHTML = stateBox('note-grid-empty', '📭 暂无笔记，先去写第一篇吧');
          } else {
            // 【状态 4：有数据】正常渲染卡片网格
            var cards = window.MOCK_NOTES.map(window.renderNoteCard).join('');
            /* Day 9：标题套上 .note-grid-heading 类，统一它和卡片网格的间距（之前用 docsify 默认大间距，跟卡片对不上） */
            wrap.innerHTML = '<h2 id="笔记导航" class="note-grid-heading">📚 笔记导航</h2><div class="note-grid">' + cards + '</div>';
          }

          // 把卡片区域插到首页正文的最上面
          section.insertBefore(wrap, section.firstChild);
        });
      }

      // 把上面的插件挂到 docsify 配置上（plugins 是个数组，我们插到最前面）
      window.$docsify.plugins = [noteCardGrid].concat(window.$docsify.plugins || []);
    })();
  </script>

  <!-- docsify 主脚本（把 Markdown 渲染成网页的"发动机"） -->
  <script src="https://cdn.staticfile.net/docsify/4.13.1/docsify.min.js"></script>
  <!-- 搜索插件（技术设计文档"对象 2：搜索索引"就是它在运行时生成的） -->
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/search.min.js"></script>
</body>
</html>
